<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book a call</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0c0b10;color:#f1eee8;font:15px 'Manrope',sans-serif}form{width:min(420px,92vw);display:grid;gap:14px}h1{font:800 44px/1 'Syne',sans-serif;margin:0 0 6px;letter-spacing:-.03em}p{color:#9a95a8;margin:0 0 8px}
input{padding:14px;border:1.5px solid #2b2838;border-radius:14px;background:#15131c;color:#f1eee8;font:inherit}input:focus{outline:0;border-color:#c8ff3d}button{border:0;background:#c8ff3d;color:#0c0b10;padding:14px;border-radius:99px;font:700 15px 'Manrope';cursor:pointer}#m{min-height:22px;color:#c8ff3d;font-weight:700}</style></head>
<body><form id="f"><h1>Book a call</h1><p>Pick a time and we will confirm by email.</p><input id="n" placeholder="Your name" required><input id="e" type="email" placeholder="Your email" required><input id="s" type="datetime-local" required><input id="t" placeholder="What would you like to discuss?"><button>Book this time</button><div id="m"></div></form>
<script>const u=new URLSearchParams(location.search).get('u')||1;f.onsubmit=async x=>{x.preventDefault();const r=await fetch('/api/book/'+u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n.value,email:e.value,slot:s.value,topic:t.value})});const j=await r.json();m.textContent=r.ok?'Booked. We will email you to confirm.':j.error}</script></body></html>
